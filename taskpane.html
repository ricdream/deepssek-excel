<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek para Excel</title>
<script src="polyfills.js"></script>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
    * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:"Segoe UI", system-ui, sans-serif; font-size:14px; background:#ffffff; color:#1f2328;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #e3e6ea; }
  header h1 { font-size:15px; margin:0; flex:1; }
  .icon-btn { background:none; border:1px solid #e3e6ea; color:#1f2328; border-radius:6px; padding:4px 8px; cursor:pointer; font-size:13px; }
  .icon-btn:hover { border-color:#4d6bfe; }
  #settings { display:none; padding:10px 12px; border-bottom:1px solid #e3e6ea; background:#f3f4f6; }
  #settings.open { display:block; }
  #settings label { display:block; font-size:12px; color:#6b7280; margin:8px 0 3px; }
  #settings label:first-child { margin-top:0; }
  #settings input[type=password], #settings input[type=text], #settings select {
    width:100%; padding:6px 8px; border:1px solid #e3e6ea; border-radius:6px; background:#ffffff; color:#1f2328; }
  #settings .row { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13px; }
  #settings .hint { font-size:11px; color:#6b7280; margin-top:6px; }
  #chat { flex:1 1 0px; min-height:0; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:92%; padding:8px 11px; border-radius:10px; line-height:1.45; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:#e8edff; }
  .msg.bot { align-self:flex-start; background:#f3f4f6; }
  .msg.err .txt { color:#cf222e; }
  .msg pre { background:rgba(0,0,0,.08); padding:6px 8px; border-radius:6px; overflow-x:auto; font-size:12px; margin:6px 0; }
  .msg code { background:rgba(0,0,0,.08); padding:1px 4px; border-radius:4px; font-size:12.5px; }
  .acts { margin-top:6px; font-size:13px; }
  .acts div { margin-top:3px; }
  .acts .ok { color:#1a7f37; } .acts .bad { color:#cf222e; } .acts .run { color:#6b7280; }
  .tools { margin-top:6px; }
  .tools button { font-size:12px; background:none; border:1px solid #e3e6ea; color:#6b7280; border-radius:5px; padding:2px 7px; cursor:pointer; }
  .tools button:hover { color:#4d6bfe; border-color:#4d6bfe; }
  #chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 8px; }
  .chip { font-size:12px; border:1px solid #e3e6ea; border-radius:14px; padding:3px 9px; background:none; color:#1f2328; cursor:pointer; }
  .chip:hover { border-color:#4d6bfe; color:#4d6bfe; }
  footer { border-top:1px solid #e3e6ea; padding:10px 12px; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; height:56px; padding:7px 9px; border:1px solid #e3e6ea; border-radius:8px;
             background:#ffffff; color:#1f2328; font-family:inherit; font-size:14px; }
  textarea:focus, input:focus, select:focus { outline:2px solid #4d6bfe; outline-offset:-1px; }
  #send { background:#4d6bfe; color:#ffffff; border:none; border-radius:8px; padding:9px 14px; cursor:pointer; font-weight:600; }
  #send:disabled { opacity:.5; cursor:default; }
  /* Arreglo IE11: evita que los mensajes se encojan y se sobrepongan */
  .msg { -ms-flex: none; flex: none; flex-shrink: 0; -ms-flex-negative: 0; width: auto; }
  #chat { display: block; }
  #chat .msg { display: block; margin-bottom: 10px; clear: both; }
  #chat .msg.user { margin-left: auto; margin-right: 0; float: right; }
  #chat .msg.bot { margin-right: auto; margin-left: 0; float: left; }
  #chat:after { content: ""; display: block; clear: both; }
  header, #chips, footer, #settings { -ms-flex: none; flex: none; flex-shrink: 0; }
  #adj { padding: 0 12px; -ms-flex: none; flex: none; }
  .thumb { position: relative; display: inline-block; margin: 0 8px 6px 0; }
  .thumb img { height: 56px; border: 1px solid #e3e6ea; border-radius: 6px; display: block; }
  .thumb button { position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; padding: 0; line-height: 16px;
                  border-radius: 9px; border: none; background: #cf222e; color: #fff; cursor: pointer; font-size: 13px; }
  .msg img.pic { max-width: 140px; max-height: 100px; border-radius: 6px; margin: 6px 6px 0 0; display: block; border: 1px solid #e3e6ea; }
</style>
</head>
<body>
<header>
  <h1>DeepSeek para Excel</h1>
  <button class="icon-btn" id="clear" title="Limpiar chat">Limpiar</button>
  <button class="icon-btn" id="gear" title="Configuración">⚙ Ajustes</button>
</header>

<section id="settings">
  <label for="key">API Key de DeepSeek</label>
  <input type="password" id="key" placeholder="sk-..." autocomplete="off">
  <label for="model">Modelo</label>
  <select id="model">
    <option value="deepseek-chat">deepseek-chat (rápido)</option>
    <option value="deepseek-reasoner">deepseek-reasoner (razona más, más lento)</option>
  </select>
  <label for="vmodel">Modelo para imágenes</label>
  <input type="text" id="vmodel" placeholder="deepseek-v4-flash-vision-exp" autocomplete="off">
  <div class="row"><input type="checkbox" id="useData" checked><label for="useData" style="margin:0;color:inherit;font-size:13px">Enviar datos de la hoja activa a DeepSeek</label></div>
  <div class="hint">Tu clave se guarda solo en este equipo. Si desmarcas la casilla, DeepSeek no verá tus datos (pero tampoco podrá crear columnas basadas en ellos).</div>
  <button class="icon-btn" id="save" style="margin-top:8px">Guardar</button>
</section>

<div id="chat"></div>
<div id="chips">
  <button class="chip" data-q="Explícame qué contienen estos datos y dame 3 observaciones útiles.">Explicar datos</button>
  <button class="chip" data-q="Crea una columna llamada Total que multiplique las columnas de precio y cantidad.">Columna con fórmula</button>
  <button class="chip" data-q="Crea una columna llamada Sentimiento que clasifique cada comentario como Positivo, Neutro o Negativo.">Columna con IA</button>
</div>
<div id="adj"></div>
<footer>
  <button class="icon-btn" id="attach" type="button" title="Adjuntar imagen" style="height:56px">📎</button>
  <input type="file" id="file" accept="image/*" multiple style="display:none">
  <textarea id="q" placeholder="Pregunta o pide algo… (Enter envía, Shift+Enter salto de línea)"></textarea>
  <button id="send">Enviar</button>
</footer>

<script src="app.js"></script>
</body>
</html>
